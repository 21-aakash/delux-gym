<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deluxe Gym | Retro Gym Ambient Radio</title>
    <meta name="description" content="Tune in to Deluxe Gym — 90s/2000s Bollywood pump tracks and local Indian gym ambience. Re-live the era of iron plates, trainer motivation, and heavy grunts.">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Deluxe Gym | Retro Gym Ambient Radio">
    <meta property="og:description" content="90s/2000s Bollywood pump tracks and local Indian gym ambience. Re-live the era of iron plates, trainer motivation, and heavy grunts.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gym-retro.local">
    <meta property="og:image" content="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1200&auto=format&fit=crop">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Yatra+One&family=Hind:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Styling -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full overflow-hidden select-none">



    <!-- Hero Fullscreen Illustration Background -->
    <div class="hero-bg" style="background-image: url('retro-gym-illustration.jpg');">
        <div class="hero-overlay"></div>
    </div>

    <main class="app-layout">
        <!-- Minimal Top Bar (Counter Centered, Socials Right) -->
        <header class="gym-navbar">
            
            <!-- Centered Live Counter -->
            <div class="nav-status">
                <span class="pulse-dot"></span>
                <span class="status-count">138</span>
                <span class="status-label">online</span>
            </div>

            <!-- Top Right Links -->
            <div class="nav-links">
                <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" class="nav-pill spotify" aria-label="Spotify">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                    <span>Spotify</span>
                </a>
                <a href="https://music.youtube.com" target="_blank" rel="noopener noreferrer" class="nav-pill yt-music" aria-label="YouTube Music">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
                    <span>YT Music</span>
                </a>
            </div>
        </header>

        <!-- Huge Centered Retro Hindi Branding (like Deluxe Saloon) -->
        <div class="centered-brand-container">
            <h1 class="centered-hindi-logo">डीलक्स जिम</h1>
        </div>

        <!-- Lower Floating Audio Controller -->
        <div class="audio-control-center">
            <!-- Consolidated Music Player Card -->
            <div class="main-player-card">
                
                <!-- Music Control Row -->
                <div class="player-main-row">
                    <!-- Spinning Plate Cover -->
                    <div class="spinning-plate-wrapper">
                        <div class="mini-barbell-plate" id="barbellPlate">
                            <div class="plate-ring"></div>
                            <span class="plate-weight-num">20</span>
                            <div class="plate-hub"></div>
                            <!-- Hidden YouTube Player Container Inside Plate -->
                            <div id="ytPlayerContainer"></div>
                        </div>
                    </div>

                    <!-- Song Info & Progress -->
                    <div class="player-info-section">
                        <div class="song-meta">
                            <h2 class="song-title" id="trackTitle">Loading Gym Radio...</h2>
                            <p class="song-artist" id="trackArtist">Tap play to start lifting</p>
                        </div>
                        <div class="song-progress-container">
                            <span class="time-elapsed" id="currentTime">0:00</span>
                            <div class="progress-track" id="progressBarWrapper">
                                <div class="progress-fill" id="progressBar"></div>
                            </div>
                            <span class="time-total" id="totalTime">0:00</span>
                        </div>
                    </div>

                    <!-- Player Navigation Actions -->
                    <div class="player-actions">
                        <button class="action-btn" id="prevBtn" aria-label="Previous Track">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="action-btn play-btn" id="playPauseBtn" aria-label="Play">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="action-btn" id="nextBtn" aria-label="Next Track">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
                        </button>
                        <button class="action-btn toggle-mixer-btn" id="toggleMixerBtn" aria-label="Toggle Ambience Mixer">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                        <a class="action-btn yt-link-btn" id="ytLinkBtn" href="#" target="_blank" rel="noopener noreferrer" aria-label="Play on YouTube" style="display: grid; place-items: center; text-decoration: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.517 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.871.508 9.388.508 9.388.508s7.517 0 9.388-.508a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                        </a>
                    </div>
                </div>

                <!-- Collapsible Ambience Sliders Drawer -->
                <div class="mixer-drawer" id="mixerDrawer">
                    <div class="mixer-header">
                        <span class="mixer-title">DESI AMBIENCE GENERATOR</span>
                    </div>
                    <div class="mixer-body">
                        <!-- Iron Plate Clang -->
                        <div class="slider-control">
                            <div class="slider-label">
                                <span class="emoji">🏋️</span>
                                <span class="label-text">Iron Clangs</span>
                            </div>
                            <input type="range" min="0" max="100" value="0" class="mini-slider" id="clangSlider">
                            <span class="slider-percentage" id="clangValue">OFF</span>
                        </div>

                        <!-- Fan AC Hum -->
                        <div class="slider-control">
                            <div class="slider-label">
                                <span class="emoji">💨</span>
                                <span class="label-text">Industrial Fan</span>
                            </div>
                            <input type="range" min="0" max="100" value="0" class="mini-slider" id="fanSlider">
                            <span class="slider-percentage" id="fanValue">OFF</span>
                        </div>

                        <!-- Grunts & Motivation -->
                        <div class="slider-control">
                            <div class="slider-label">
                                <span class="emoji">🗣️</span>
                                <span class="label-text">Motivation</span>
                            </div>
                            <input type="range" min="0" max="100" value="0" class="mini-slider" id="motivationSlider">
                            <span class="slider-percentage" id="motivationValue">OFF</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
